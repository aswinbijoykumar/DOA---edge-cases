<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" preserveAspectRatio="xMidYMid slice" width="1400" height="420">
<title>Delegation of authority matrix animated background</title>
<style>
.grid{stroke:#A9D6D2;stroke-width:1;opacity:.07}
.edge{fill:none;stroke:#A9D6D2;stroke-width:1;opacity:.28}
.node{fill:#08283A;stroke:#CDE8E4;stroke-width:1;opacity:.7}
.node.root{fill:#CDE8E4;opacity:.9}
.pulse{fill:none;stroke:#F5CF8A;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:70 1000;stroke-dashoffset:70;animation:travel 9.0s linear infinite}
.glow{filter:url(#blur);opacity:.9}
.ring{fill:none;stroke:#F5CF8A;stroke-width:1;opacity:0;animation:ring 9.0s ease-out infinite}
.cell{fill:#5FB8AD;opacity:0;animation-name:cell;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
@keyframes travel{0%{stroke-dashoffset:70}55%{stroke-dashoffset:-1000}100%{stroke-dashoffset:-1000}}
@keyframes ring{0%{opacity:.8;r:3}16%{opacity:0;r:15}100%{opacity:0;r:15}}
@keyframes cell{0%,100%{opacity:0}45%,55%{opacity:.14}}
@media (prefers-reduced-motion:reduce){.pulse,.ring,.cell{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#071C2B"/><stop offset=".45" stop-color="#0B3C4D"/><stop offset="1" stop-color="#1B6B63"/></linearGradient>
<radialGradient id="haloR" cx="78%" cy="55%" r="45%"><stop offset="0" stop-color="#2FA39A" stop-opacity=".30"/><stop offset="1" stop-color="#2FA39A" stop-opacity="0"/></radialGradient>
<radialGradient id="haloL" cx="22%" cy="55%" r="45%"><stop offset="0" stop-color="#2FA39A" stop-opacity=".30"/><stop offset="1" stop-color="#2FA39A" stop-opacity="0"/></radialGradient>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" class="grid"/></pattern>
<filter id="blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="1400" height="420" fill="url(#bg)"/>
